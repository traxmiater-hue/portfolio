<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд продаж — отчёт из выгрузки CSV</title>
<style>
:root{--bg:#0f1117;--card:#171a23;--line:#262a37;--text:#e7e9f0;--muted:#8a90a6;--a:#4f8cff;--b:#22c55e;--c:#f59e0b;--d:#e879f9}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px 28px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:22px;margin-right:auto}.top h1 small{color:var(--muted);font-weight:400;font-size:14px;display:block}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:#262b3a;color:#fff}
label.up{border:1px dashed #3a4157;border-radius:12px;padding:9px 14px;cursor:pointer;font-size:14px;color:var(--muted)}
label.up input{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.kpis b{font-size:28px;display:block;margin:6px 0 4px}.kpis span{color:var(--muted);font-size:13px}
.up-tr{color:#4ade80}.down-tr{color:#f87171}
.row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.card h2{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:12px}
svg text{fill:var(--muted);font-size:11px}
.bars div{margin-bottom:12px}.bars .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bars .t{height:10px;background:#232736;border-radius:6px;overflow:hidden}.bars .t i{display:block;height:100%;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);text-align:left;font-weight:600;padding:10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:hover{color:#fff}td{padding:10px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:#23283a}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><h1>Продажи интернет-магазина <small id="src">демо-данные · 1 840 заказов</small></h1>
  <div class="seg" id="per"><button data-d="30">30 дней</button><button data-d="90" class="on">90 дней</button><button data-d="365">Год</button></div>
  <label class="up">⬆ Загрузить CSV<input type="file" id="file" accept=".csv"></label></div>
<div class="kpis" id="kpis"></div>
<div class="row"><div class="card"><h2>Выручка по дням</h2><svg id="chart" viewBox="0 0 760 240" width="100%"></svg></div>
  <div class="card"><h2>По категориям</h2><div class="bars" id="cats"></div></div></div>
<div class="card"><h2>Топ товаров</h2><table><thead><tr><th data-k="name">Товар</th><th data-k="cat">Категория</th><th class="n" data-k="qty">Продано, шт</th><th class="n" data-k="sum">Выручка</th><th class="n" data-k="avg">Средний чек</th></tr></thead><tbody id="top"></tbody></table></div>
<script>
// CSV: date;product;category;qty;price — такую выгрузку отдают 1С, МойСклад, Ozon/WB
const COLORS = ['#4f8cff', '#22c55e', '#f59e0b', '#e879f9', '#38bdf8'];
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
function demo() {
  const P = [['Кофе зерновой 1 кг','Кофе',1490],['Кофе молотый 250 г','Кофе',590],['Чай улун 100 г','Чай',690],['Френч-пресс 0,6 л','Посуда',1290],
             ['Кофемолка ручная','Техника',2890],['Капсулы 10 шт','Кофе',390],['Чай пуэр 357 г','Чай',2190],['Кружка двойная','Посуда',890],['Турка медная','Посуда',1690]];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const rows = [], end = new Date('2026-11-09');
  for (let i = 365; i >= 0; i--) {
    const dt = new Date(end - i * 864e5), wk = dt.getDay() % 6 === 0 ? 1.35 : 1, trend = 1 + (365 - i) / 520;
    const n = Math.round((3 + rnd() * 4) * wk * trend);
    for (let j = 0; j < n; j++) { const p = P[Math.floor(rnd() ** 1.6 * P.length)]; rows.push({date: dt.toISOString().slice(0, 10), name: p[0], cat: p[1], qty: 1 + Math.floor(rnd() * 2.2), price: p[2]}); }
  }
  return rows;
}
let all = demo(), days = 90, sortK = 'sum';
function parse(text) {
  const [head, ...lines] = text.trim().split(/\r?\n/); const sep = head.includes(';') ? ';' : ',';
  const h = head.split(sep).map(s => s.trim().toLowerCase());
  const ix = k => h.findIndex(x => x.includes(k));
  return lines.map(l => l.split(sep)).map(c => ({date: c[ix('date')], name: c[ix('product')], cat: c[ix('categ')], qty: +c[ix('qty')], price: +c[ix('price')]})).filter(r => r.date && r.qty);
}
function render() {
  const last = all.reduce((m, r) => r.date > m ? r.date : m, '');
  const from = new Date(new Date(last) - days * 864e5).toISOString().slice(0, 10);
  const prevFrom = new Date(new Date(last) - 2 * days * 864e5).toISOString().slice(0, 10);
  const cur = all.filter(r => r.date > from), prev = all.filter(r => r.date > prevFrom && r.date <= from);
  const sum = a => a.reduce((s, r) => s + r.qty * r.price, 0), orders = a => a.length;
  const tr = (c, p) => { const v = p ? (c - p) / p * 100 : 0; return `<span class="${v >= 0 ? 'up-tr' : 'down-tr'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v).toFixed(1)}%</span>`; };
  const k = [['Выручка', rub(sum(cur)), tr(sum(cur), sum(prev))], ['Заказы', orders(cur).toLocaleString('ru-RU'), tr(orders(cur), orders(prev))],
             ['Средний чек', rub(sum(cur) / (orders(cur) || 1)), tr(sum(cur) / (orders(cur) || 1), sum(prev) / (orders(prev) || 1))],
             ['Товаров продано', cur.reduce((s, r) => s + r.qty, 0).toLocaleString('ru-RU'), tr(cur.reduce((s, r) => s + r.qty, 0), prev.reduce((s, r) => s + r.qty, 0))]];
  document.getElementById('kpis').innerHTML = k.map(([n, v, t]) => `<div class="card"><span>${n}</span><b>${v}</b>${t} <span>к прошлому периоду</span></div>`).join('');
  // график по дням (неделями, если период год)
  const step = days > 120 ? 7 : 1, buckets = {};
  cur.forEach(r => { const i = Math.floor((new Date(r.date) - new Date(from)) / 864e5 / step); buckets[i] = (buckets[i] || 0) + r.qty * r.price; });
  const n = Math.ceil(days / step), vals = Array.from({length: n}, (_, i) => buckets[i] || 0), max = Math.max(...vals) * 1.1;
  const X = i => 40 + i * (700 / (n - 1)), Y = v => 210 - v / max * 190;
  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  let g = [0, .5, 1].map(f => `<line x1="40" x2="740" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="#262a37"/><text x="0" y="${Y(max * f) + 4}">${Math.round(max * f / 1000)}к</text>`).join('');
  g += `<path d="${line} L740 210 L40 210Z" fill="url(#gr)"/><path d="${line}" fill="none" stroke="#4f8cff" stroke-width="2.2"/>`;
  document.getElementById('chart').innerHTML = `<defs><linearGradient id="gr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4f8cff" stop-opacity=".35"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></linearGradient></defs>` + g;
  const cats = {}; cur.forEach(r => cats[r.cat] = (cats[r.cat] || 0) + r.qty * r.price);
  const cs = Object.entries(cats).sort((a, b) => b[1] - a[1]), cmax = cs[0]?.[1] || 1;
  document.getElementById('cats').innerHTML = cs.map(([c, v], i) => `<div><div class="l"><span>${c}</span><b>${rub(v)}</b></div><div class="t"><i style="width:${v / cmax * 100}%;background:${COLORS[i % 5]}"></i></div></div>`).join('');
  const prods = {}; cur.forEach(r => { const p = prods[r.name] ||= {name: r.name, cat: r.cat, qty: 0, sum: 0, n: 0}; p.qty += r.qty; p.sum += r.qty * r.price; p.n++; });
  const list = Object.values(prods).map(p => ({...p, avg: p.sum / p.n})).sort((a, b) => typeof a[sortK] === 'string' ? a[sortK].localeCompare(b[sortK]) : b[sortK] - a[sortK]);
  document.getElementById('top').innerHTML = list.map(p => `<tr><td>${p.name}</td><td><span class="chip">${p.cat}</span></td><td class="n">${p.qty}</td><td class="n"><b>${rub(p.sum)}</b></td><td class="n">${rub(p.avg)}</td></tr>`).join('');
}
document.getElementById('per').addEventListener('click', e => { if (!e.target.dataset.d) return; days = +e.target.dataset.d; document.querySelectorAll('#per button').forEach(b => b.classList.toggle('on', b === e.target)); render(); });
document.querySelector('thead').addEventListener('click', e => { if (e.target.dataset.k) { sortK = e.target.dataset.k; render(); } });
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return; const rows = parse(await f.text());
  if (!rows.length) return alert('Не нашёл колонки date;product;category;qty;price');
  all = rows; document.getElementById('src').textContent = `${f.name} · ${rows.length.toLocaleString('ru-RU')} строк`; render();
});
document.getElementById('src').textContent = `демо-данные · ${all.length.toLocaleString('ru-RU')} заказов`;
render();
</script>
</body>
</html>
